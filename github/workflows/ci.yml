name: Retail Supply Chain CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      # 4. Lint code for syntax errors and undefined variables
      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings (non-blocking style check)
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. Execute automated test suite
      - name: Run Pytest
        env:
          # Provide mock environment variable for CI test execution
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_key_for_testing' }}
        run: |
          pytest